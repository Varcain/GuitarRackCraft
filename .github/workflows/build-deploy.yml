# Build & Deploy — two independent, separately-gated release paths:
#   * create_github_release -> `full` (VST) edition: build the VST components
#     (vst-components.yml) + hosts, assembleFullRelease (HAS_VST_HOST=true),
#     publish a GitHub Release APK.
#   * upload_to_play_store  -> `playstore` edition: bundlePlaystoreRelease only
#     (no :vsthost_lib, no wine), upload the AAB to Google Play.
# The Play Store path never bundles VST; the VST pipeline never runs for a
# Play-Store-only dispatch.

name: Build & Deploy

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 1.0.0, 1.0.0-beta.1)"
        required: true
        type: string
      version_code:
        description: "Version code (integer, must be higher than previous release)"
        required: true
        type: string
      create_github_release:
        description: "Create a GitHub Release"
        required: true
        type: boolean
        default: true
      upload_to_play_store:
        description: "Upload AAB to Play Store (internal testing)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-deploy

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  COMMON_APT: >-
    build-essential autoconf automake libtool bison flex gettext gperf
    pkg-config cmake ninja-build meson patchelf patch python3 python3-pip
    python3-mako git xz-utils ca-certificates curl
  X11_APT: >-
    libx11-dev libxext-dev libxrender-dev libxrandr-dev libxi-dev
    libxfixes-dev libxcursor-dev libxxf86vm-dev libfreetype-dev
    fonts-liberation fonts-dejavu
  NATIVE_APT: >-
    gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 g++-mingw-w64-x86-64
    ocaml ocamlbuild ocaml-findlib libnum-ocaml-dev faust libboost-dev ccache

jobs:
  components:
    if: ${{ inputs.create_github_release }}
    uses: ./.github/workflows/vst-components.yml

  full-release:
    if: ${{ inputs.create_github_release }}
    needs: components
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6  # v2.0.0
        with: { android: false, preinstalled-runtimes: false, dotnet: true, haskell: true, large-packages: true, docker-images: true, swap-storage: true }

      # ── 1. Checkout & submodules ────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore submodule cache
        id: submodule-cache
        uses: actions/cache/restore@v4
        with:
          path: .git/modules
          key: submodules-${{ runner.os }}-${{ hashFiles('.gitmodules') }}-${{ github.sha }}
          restore-keys: |
            submodules-${{ runner.os }}-${{ hashFiles('.gitmodules') }}-

      - name: Initialize submodules
        run: git submodule update --init --recursive --depth 1

      - name: Save submodule cache
        if: steps.submodule-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .git/modules
          key: submodules-${{ runner.os }}-${{ hashFiles('.gitmodules') }}-${{ github.sha }}

      # ── 2. System dependencies ───────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends $COMMON_APT $X11_APT $NATIVE_APT

      # ── 3. JDK 17 + Android SDK packages ────────────────────────────────
      - name: Android toolchain
        uses: ./.github/actions/setup-android

      # ── 4. VST host components (built by the components jobs) ────────────
      - name: Restore VST components
        uses: ./.github/actions/vst-components
        with: { keys: "${{ toJSON(needs.components.outputs) }}" }

      # ── 5. Native build cache ─────────────────────────────────────────────
      - name: Restore native build cache
        id: native-cache
        uses: ./.github/actions/native-cache
        with: { mode: restore }

      # ── 6. ccache ─────────────────────────────────────────────────────────
      - name: Setup ccache
        run: |
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --set-config=sloppiness=include_file_mtime,include_file_ctime,time_macros,file_stat_matches,file_stat_matches_ctime
          ccache --set-config=hash_dir=false
          ccache --zero-stats

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      # pack-wine-fex.py -> vsthost_lib/src/main/{jniLibs,assets}
      - name: Pack the VST host stack
        env:
          ANDROID_NDK: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VSTHOST }}
        run: cd vsthost_lib && bash scripts/build-all.sh pack

      # ── 7. Native build (Ninja handles incrementality) ──────────────────
      - name: Build native libraries
        # BUILD_VST=0: VST stack already packed from the cached components above.
        run: BUILD_VST=0 ./build.sh full
        env:
          ANDROID_NDK: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_NATIVE }}
          NATIVE_CACHE_EXACT: ${{ steps.native-cache.outputs.cache-hit }}

      - name: Dump ExternalProject logs on failure
        if: failure()
        run: for f in build/prebuild/*/src/*/stamp/*-*.log; do [ -f "$f" ] && echo "=== $f ===" && cat "$f"; done || true

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats

      - name: Save native build cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/native-cache
        with:
          mode: save
          key: ${{ steps.native-cache.outputs.key }}

      - name: Save ccache
        if: "!cancelled() && steps.ccache-restore.outputs.cache-hit != 'true'"
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}

      # ── 8. Decode release keystore ───────────────────────────────────────
      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          # keytool tells JKS from PKCS12 itself; the password stays off the
          # command line.
          if ! keytool -list -keystore "$RUNNER_TEMP/upload.keystore" \
                 -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null; then
            echo "::error::the keystore doesn't open with KEYSTORE_PASSWORD, or has no KEY_ALIAS entry"
            exit 1
          fi
          echo "Keystore decoded and validated OK"

      # ── 9. Patch version ─────────────────────────────────────────────────
      - name: Set versionCode and versionName
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          # app/build.gradle.kts reads them as the grcVersionCode /
          # grcVersionName Gradle properties.
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "version_code must be an integer" >&2; exit 1; }
          [[ "$VERSION_NAME" =~ ^[A-Za-z0-9._+-]+$ ]] || { echo "version_name has unexpected characters" >&2; exit 1; }
          echo "ORG_GRADLE_PROJECT_grcVersionCode=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_grcVersionName=$VERSION_NAME" >> "$GITHUB_ENV"

      # ── 10. Build the VST ("full" flavor) release APK ────────────────────
      #     assembleFullRelease only — no playstore bundle/AAB is produced.
      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build VST release APK
        env:
          # app/build.gradle.kts reads them as the RELEASE_* Gradle properties.
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ${{ runner.temp }}/upload.keystore
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleFullRelease

      - name: Save Gradle cache
        if: "!cancelled() && steps.gradle-cache.outputs.cache-hit != 'true'"
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      # ── 11. Upload APK artifact ──────────────────────────────────────────
      - name: Find built APK
        id: artifacts
        run: |
          APK=$(find app/build/outputs/apk/full/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No full/release APK found"
            exit 1
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      # Fails on Windows PE files packaged under lib/ as .so - what antivirus
      # engines flagged in the full APK.
      - name: Audit the APK's Windows binaries
        env:
          APK: ${{ steps.artifacts.outputs.apk }}
        run: python3 tools/vt_check.py audit "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: guitarrackcraft-vst-${{ inputs.version_name }}-apk
          path: ${{ steps.artifacts.outputs.apk }}

      # ── 12. GitHub Release ───────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: v${{ inputs.version_name }}
          name: Guitar RackCraft v${{ inputs.version_name }}
          files: ${{ steps.artifacts.outputs.apk }}
          prerelease: ${{ contains(inputs.version_name, 'beta') || contains(inputs.version_name, 'alpha') || contains(inputs.version_name, 'rc') }}
          generate_release_notes: true

      # ── 13. Cleanup ──────────────────────────────────────────────────────
      - name: Remove upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"

  playstore-release:
    if: ${{ inputs.upload_to_play_store }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ── 1. Checkout & submodules ────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore submodule cache
        id: submodule-cache
        uses: actions/cache/restore@v4
        with:
          path: .git/modules
          key: submodules-${{ runner.os }}-${{ hashFiles('.gitmodules') }}-${{ github.sha }}
          restore-keys: |
            submodules-${{ runner.os }}-${{ hashFiles('.gitmodules') }}-

      - name: Initialize submodules
        run: git submodule update --init --recursive --depth 1

      - name: Save submodule cache
        if: steps.submodule-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .git/modules
          key: submodules-${{ runner.os }}-${{ hashFiles('.gitmodules') }}-${{ github.sha }}

      # ── 2. System dependencies ───────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build meson python3 python3-mako pkg-config \
            autoconf automake libtool gettext patch cmake \
            flex bison ocaml ocamlbuild ocaml-findlib libnum-ocaml-dev \
            faust libboost-dev

      # ── 3. JDK 17 + Android SDK packages ────────────────────────────────
      - name: Android toolchain
        uses: ./.github/actions/setup-android
        with: { vst-ndk: false }

      # ── 4. Native build cache ─────────────────────────────────────────────
      - name: Restore native build cache
        id: native-cache
        uses: ./.github/actions/native-cache
        with: { mode: restore }

      # ── 5. ccache ─────────────────────────────────────────────────────────
      - name: Setup ccache
        run: |
          sudo apt-get install -y --no-install-recommends ccache
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --set-config=sloppiness=include_file_mtime,include_file_ctime,time_macros,file_stat_matches,file_stat_matches_ctime
          ccache --set-config=hash_dir=false
          ccache --zero-stats

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      # ── 6. Native build (Ninja handles incrementality) ──────────────────
      - name: Build native libraries
        # playstore flavor only — no VST, no full-flavor overlay.
        run: ./build.sh playstore
        env:
          ANDROID_NDK: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_NATIVE }}
          NATIVE_CACHE_EXACT: ${{ steps.native-cache.outputs.cache-hit }}

      - name: Dump ExternalProject logs on failure
        if: failure()
        run: for f in build/prebuild/*/src/*/stamp/*-*.log; do [ -f "$f" ] && echo "=== $f ===" && cat "$f"; done || true

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats

      - name: Save native build cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/native-cache
        with:
          mode: save
          key: ${{ steps.native-cache.outputs.key }}

      - name: Save ccache
        if: "!cancelled() && steps.ccache-restore.outputs.cache-hit != 'true'"
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}

      # ── 7. Decode upload keystore ────────────────────────────────────────
      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          # keytool tells JKS from PKCS12 itself; the password stays off the
          # command line.
          if ! keytool -list -keystore "$RUNNER_TEMP/upload.keystore" \
                 -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null; then
            echo "::error::the keystore doesn't open with KEYSTORE_PASSWORD, or has no KEY_ALIAS entry"
            exit 1
          fi
          echo "Keystore decoded and validated OK"

      # ── 8. Patch version ─────────────────────────────────────────────────
      - name: Set versionCode and versionName
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          # app/build.gradle.kts reads them as the grcVersionCode /
          # grcVersionName Gradle properties.
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "version_code must be an integer" >&2; exit 1; }
          [[ "$VERSION_NAME" =~ ^[A-Za-z0-9._+-]+$ ]] || { echo "version_name has unexpected characters" >&2; exit 1; }
          echo "ORG_GRADLE_PROJECT_grcVersionCode=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_grcVersionName=$VERSION_NAME" >> "$GITHUB_ENV"

      # ── 9. Build the Play Store AAB (playstore flavor, no VST) ──────────────────
      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build Play Store AAB (playstore flavor — no VST)
        env:
          # app/build.gradle.kts reads them as the RELEASE_* Gradle properties.
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ${{ runner.temp }}/upload.keystore
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundlePlaystoreRelease

      - name: Save Gradle cache
        if: "!cancelled() && steps.gradle-cache.outputs.cache-hit != 'true'"
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      # ── 10. Upload workflow artifact (AAB only) ──────────────────────────
      - name: Find built AAB
        id: artifacts
        run: |
          AAB=$(find app/build/outputs/bundle/playstoreRelease -name '*.aab' | head -1)
          if [ -z "$AAB" ]; then
            echo "::error::No playstoreRelease AAB found"
            exit 1
          fi
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: guitarrackcraft-${{ inputs.version_name }}-aab
          path: ${{ steps.artifacts.outputs.aab }}


      # ── 11. Verify AAB signature ─────────────────────────────────────────
      - name: Verify AAB is signed
        env:
          AAB: ${{ steps.artifacts.outputs.aab }}
        run: |
          # jarsigner -verify exits 0 on an unsigned file too; only a file whose
          # signature checks out prints "jar verified."
          jarsigner -verify "$AAB" | tee "$RUNNER_TEMP/jarsigner.txt"
          if ! grep -qx 'jar verified\.' "$RUNNER_TEMP/jarsigner.txt"; then
            echo "::error::$AAB is not signed, or its signature doesn't verify"
            exit 1
          fi

      # ── 12. Play Store upload ────────────────────────────────────────────
      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5  # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_KEY }}
          packageName: com.varcain.guitarrackcraft
          releaseFiles: ${{ steps.artifacts.outputs.aab }}
          track: internal
          status: draft

      # ── 13. Cleanup ──────────────────────────────────────────────────────
      - name: Remove upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"
