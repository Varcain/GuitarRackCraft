# Build & Deploy — two independent, separately-gated release paths:
#   * create_github_release -> `full` (VST) edition: build the VST components
#     (vst-components.yml) + hosts, assembleFullRelease (HAS_VST_HOST=true),
#     publish a GitHub Release APK.
#   * upload_to_play_store  -> `playstore` edition: bundlePlaystoreRelease only
#     (no :vsthost_lib, no wine), upload the AAB to Google Play.
# The Play Store path never bundles VST; the VST pipeline never runs for a
# Play-Store-only dispatch.

name: Build & Deploy

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 1.0.0, 1.0.0-beta.1)"
        required: true
        type: string
      version_code:
        description: "Version code (integer, must be higher than previous release)"
        required: true
        type: string
      create_github_release:
        description: "Create a GitHub Release"
        required: true
        type: boolean
        default: true
      upload_to_play_store:
        description: "Upload AAB to Play Store (internal testing)"
        required: true
        type: boolean
        default: false

concurrency:
  group: build-deploy

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  NDK_VSTHOST: 26.1.10909125
  NDK_NATIVE: 27.2.12479018
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  COMMON_APT: >-
    build-essential autoconf automake libtool bison flex gettext gperf
    pkg-config cmake ninja-build meson patchelf patch python3 python3-pip
    python3-mako git xz-utils ca-certificates curl
  X11_APT: >-
    libx11-dev libxext-dev libxrender-dev libxrandr-dev libxi-dev
    libxfixes-dev libxcursor-dev libxxf86vm-dev libfreetype-dev
    fonts-liberation fonts-dejavu
  NATIVE_APT: >-
    gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 g++-mingw-w64-x86-64
    ocaml ocamlbuild ocaml-findlib libnum-ocaml-dev faust libboost-dev ccache

jobs:
  components:
    if: ${{ inputs.create_github_release }}
    uses: ./.github/workflows/vst-components.yml

  full-release:
    if: ${{ inputs.create_github_release }}
    needs: components
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with: { android: false, tool-cache: false, dotnet: true, haskell: true, large-packages: true, docker-images: true, swap-storage: true }

      # ── 1. Checkout & submodules ────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore submodule cache
        id: submodule-cache
        uses: actions/cache/restore@v4
        with:
          path: .git/modules
          key: submodules-${{ runner.os }}-${{ hashFiles('.gitmodules') }}-${{ github.sha }}
          restore-keys: |
            submodules-${{ runner.os }}-${{ hashFiles('.gitmodules') }}-

      - name: Initialize submodules
        run: git submodule update --init --recursive --depth 1

      - name: Save submodule cache
        if: steps.submodule-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .git/modules
          key: submodules-${{ runner.os }}-${{ hashFiles('.gitmodules') }}-${{ github.sha }}

      # ── 2. System dependencies ───────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends $COMMON_APT $X11_APT $NATIVE_APT

      # ── 3. JDK 17 ───────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ── 4. Android SDK components (skip already-installed) ─────────────
      - name: Install Android SDK components (both NDKs)
        run: |
          SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses >/dev/null || true
          for pkg in "ndk;${NDK_NATIVE}" "ndk;${NDK_VSTHOST}" \
                     "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"; do
            "$SDKMGR" "$pkg"
          done

      # ── 5. VST host component caches ─────────────────────────────────────
      # Restore the component outputs produced by this workflow's cache jobs
      # before staging :vsthost_lib into the full APK.
      - name: Restore winedeps
        uses: actions/cache/restore@v4
        with:
          path: |
            vsthost_lib/toolchain/x11-libs
            vsthost_lib/toolchain/x11-headers
            vsthost_lib/toolchain/wine-fonts
            vsthost_lib/toolchain/android-libs
            vsthost_lib/toolchain/gnutls-android-arm64
          key: ${{ needs.components.outputs.winedeps }}
          fail-on-cache-miss: true

      - name: Restore wine output tar
        uses: actions/cache/restore@v4
        with:
          path: vsthost_lib/wine-android-out.tar
          key: ${{ needs.components.outputs.wine }}
          fail-on-cache-miss: true

      - name: Restore FEX Bin
        uses: actions/cache/restore@v4
        with:
          path: |
            vsthost_lib/external/fex-upstream/build-arm64ec/Bin
            vsthost_lib/external/fex-upstream/build-wow64/Bin
          key: ${{ needs.components.outputs.fex }}
          fail-on-cache-miss: true

      - name: Restore DXVK assets
        uses: actions/cache/restore@v4
        with:
          path: vsthost_lib/src/main/assets/dxvk
          key: ${{ needs.components.outputs.dxvk }}
          fail-on-cache-miss: true

      - name: Restore Mesa-Zink asset
        uses: actions/cache/restore@v4
        with:
          path: vsthost_lib/src/main/assets/mesa-zink-libs.tar.gz
          key: ${{ needs.components.outputs.mesa }}
          fail-on-cache-miss: true

      - name: Restore X11 sysroot
        uses: actions/cache/restore@v4
        with:
          path: build/x11_ui
          key: ${{ needs.components.outputs.x11 }}
          fail-on-cache-miss: true

      - name: Restore llvm-mingw install
        # pack-wine-fex.py's wine prune check reads PE imports with this
        # toolchain's llvm-readobj (needs LLVM >= 19 for the ARM64X EC view).
        uses: actions/cache/restore@v4
        with:
          path: vsthost_lib/external/llvm-mingw/install
          key: ${{ needs.components.outputs.llvm }}
          fail-on-cache-miss: true

      - name: Restore android LLVM install
        uses: actions/cache/restore@v4
        with:
          path: vsthost_lib/external/llvm-android/install-android-arm64
          key: ${{ needs.components.outputs.llvm_android }}
          fail-on-cache-miss: true

      - name: Unpack wine output into build dir
        run: |
          tar -xf vsthost_lib/wine-android-out.tar -C vsthost_lib/external/wine-upstream
          test -x vsthost_lib/external/wine-upstream/build-android-arm64/loader/wine

      # ── 6. Native build cache ─────────────────────────────────────────────
      - name: Restore native build cache
        id: native-cache
        uses: ./.github/actions/native-cache
        with: { mode: restore }

      # ── 7. ccache ─────────────────────────────────────────────────────────
      - name: Setup ccache
        run: |
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --set-config=sloppiness=include_file_mtime,include_file_ctime,time_macros,file_stat_matches,file_stat_matches_ctime
          ccache --set-config=hash_dir=false
          ccache --zero-stats

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Set up meson >= 1.4 for lavapipe
        run: |
          sudo apt-get install -y --no-install-recommends python3-venv
          python3 -m venv vsthost_lib/.cache/meson-venv
          vsthost_lib/.cache/meson-venv/bin/pip install --quiet --upgrade pip
          vsthost_lib/.cache/meson-venv/bin/pip install --quiet 'meson==1.7.2'
          vsthost_lib/.cache/meson-venv/bin/meson --version

      - name: Stage vsthost (turnip + adrenotools + hosts + pack)
        env:
          ANDROID_NDK: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VSTHOST }}
        run: cd vsthost_lib && bash scripts/build-all.sh turnip adrenotools hosts pack

      # ── 8. Native build (Ninja handles incrementality) ──────────────────
      - name: Build native libraries
        # BUILD_VST=0: VST stack already staged from the cached components above.
        run: BUILD_VST=0 ./build.sh full
        env:
          ANDROID_NDK: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_NATIVE }}
          NATIVE_CACHE_EXACT: ${{ steps.native-cache.outputs.cache-hit }}

      - name: Dump ExternalProject logs on failure
        if: failure()
        run: for f in build/prebuild/*/src/*/stamp/*-*.log; do [ -f "$f" ] && echo "=== $f ===" && cat "$f"; done || true

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats

      - name: Save native build cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/native-cache
        with:
          mode: save
          key: ${{ steps.native-cache.outputs.key }}

      - name: Save ccache
        if: "!cancelled() && steps.ccache-restore.outputs.cache-hit != 'true'"
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}

      # ── 9. Decode release keystore ───────────────────────────────────────
      - name: Decode upload keystore
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          # Verify the keystore is valid
          keytool -list -keystore "$RUNNER_TEMP/upload.keystore" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -storetype JKS 2>&1 | head -5 \
            || keytool -list -keystore "$RUNNER_TEMP/upload.keystore" \
              -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -storetype PKCS12 2>&1 | head -5
          echo "Keystore decoded and validated OK"
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}

      # ── 10. Patch version ────────────────────────────────────────────────
      - name: Set versionCode and versionName
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          # app/build.gradle.kts reads them as the grcVersionCode /
          # grcVersionName Gradle properties.
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "version_code must be an integer" >&2; exit 1; }
          [[ "$VERSION_NAME" =~ ^[A-Za-z0-9._+-]+$ ]] || { echo "version_name has unexpected characters" >&2; exit 1; }
          echo "ORG_GRADLE_PROJECT_grcVersionCode=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_grcVersionName=$VERSION_NAME" >> "$GITHUB_ENV"

      # ── 11. Build the VST ("full" flavor) release APK ────────────────────
      #     assembleFullRelease only — no playstore bundle/AAB is produced.
      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build VST release APK
        run: |
          ./gradlew assembleFullRelease \
            -PRELEASE_STORE_FILE=${{ runner.temp }}/upload.keystore \
            -PRELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} \
            -PRELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }} \
            -PRELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}

      - name: Save Gradle cache
        if: "!cancelled() && steps.gradle-cache.outputs.cache-hit != 'true'"
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      # ── 12. Upload APK artifact ──────────────────────────────────────────
      - name: Find built APK
        id: artifacts
        run: |
          APK=$(find app/build/outputs/apk/full/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No full/release APK found"
            exit 1
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: guitarrackcraft-vst-${{ inputs.version_name }}-apk
          path: ${{ steps.artifacts.outputs.apk }}

      # ── 13. GitHub Release ───────────────────────────────────────────────
      - name: Create GitHub Release
        if: inputs.create_github_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}
          name: Guitar RackCraft v${{ inputs.version_name }}
          files: ${{ steps.artifacts.outputs.apk }}
          prerelease: ${{ contains(inputs.version_name, 'beta') || contains(inputs.version_name, 'alpha') || contains(inputs.version_name, 'rc') }}
          generate_release_notes: true

      # ── 14. Cleanup ──────────────────────────────────────────────────────
      - name: Remove upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"

  playstore-release:
    if: ${{ inputs.upload_to_play_store }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      # ── 1. Checkout & submodules ────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore submodule cache
        id: submodule-cache
        uses: actions/cache/restore@v4
        with:
          path: .git/modules
          key: submodules-${{ runner.os }}-${{ hashFiles('.gitmodules') }}-${{ github.sha }}
          restore-keys: |
            submodules-${{ runner.os }}-${{ hashFiles('.gitmodules') }}-

      - name: Initialize submodules
        run: git submodule update --init --recursive --depth 1

      - name: Save submodule cache
        if: steps.submodule-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .git/modules
          key: submodules-${{ runner.os }}-${{ hashFiles('.gitmodules') }}-${{ github.sha }}

      # ── 2. System dependencies ───────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build meson python3 python3-mako pkg-config \
            autoconf automake libtool gettext patch cmake \
            flex bison ocaml ocamlbuild ocaml-findlib libnum-ocaml-dev \
            faust libboost-dev

      # ── 3. JDK 17 ───────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ── 4. Android SDK components (skip already-installed) ─────────────
      - name: Install Android SDK components
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          [ -d "$ANDROID_SDK_ROOT/ndk/27.2.12479018" ] || \
            $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018"
          [ -d "$ANDROID_SDK_ROOT/cmake/3.22.1" ] || \
            $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1"
          [ -d "$ANDROID_SDK_ROOT/platforms/android-34" ] || \
            $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34"
          [ -d "$ANDROID_SDK_ROOT/build-tools/34.0.0" ] || \
            $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0"

      # ── 5. Native build cache ─────────────────────────────────────────────
      - name: Restore native build cache
        id: native-cache
        uses: ./.github/actions/native-cache
        with: { mode: restore }

      # ── 7. ccache ─────────────────────────────────────────────────────────
      - name: Setup ccache
        run: |
          sudo apt-get install -y --no-install-recommends ccache
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --set-config=sloppiness=include_file_mtime,include_file_ctime,time_macros,file_stat_matches,file_stat_matches_ctime
          ccache --set-config=hash_dir=false
          ccache --zero-stats

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      # ── 8. Native build (Ninja handles incrementality) ──────────────────
      - name: Build native libraries
        # playstore flavor only — no VST, no full-flavor overlay.
        run: ./build.sh playstore
        env:
          ANDROID_NDK: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
          NATIVE_CACHE_EXACT: ${{ steps.native-cache.outputs.cache-hit }}

      - name: Dump ExternalProject logs on failure
        if: failure()
        run: for f in build/prebuild/*/src/*/stamp/*-*.log; do [ -f "$f" ] && echo "=== $f ===" && cat "$f"; done || true

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats

      - name: Save native build cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/native-cache
        with:
          mode: save
          key: ${{ steps.native-cache.outputs.key }}

      - name: Save ccache
        if: "!cancelled() && steps.ccache-restore.outputs.cache-hit != 'true'"
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}

      # ── 9. Decode upload keystore ────────────────────────────────────────
      - name: Decode upload keystore
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          # Verify the keystore is valid
          keytool -list -keystore "$RUNNER_TEMP/upload.keystore" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -storetype JKS 2>&1 | head -5 \
            || keytool -list -keystore "$RUNNER_TEMP/upload.keystore" \
              -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -storetype PKCS12 2>&1 | head -5
          echo "Keystore decoded and validated OK"
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}

      # ── 10. Patch version ────────────────────────────────────────────────
      - name: Set versionCode and versionName
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          # app/build.gradle.kts reads them as the grcVersionCode /
          # grcVersionName Gradle properties.
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "version_code must be an integer" >&2; exit 1; }
          [[ "$VERSION_NAME" =~ ^[A-Za-z0-9._+-]+$ ]] || { echo "version_name has unexpected characters" >&2; exit 1; }
          echo "ORG_GRADLE_PROJECT_grcVersionCode=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_grcVersionName=$VERSION_NAME" >> "$GITHUB_ENV"

      # ── 11. Build the Play Store AAB (playstore flavor, no VST) ─────────────────
      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build Play Store AAB (playstore flavor — no VST)
        run: |
          ./gradlew bundlePlaystoreRelease \
            -PRELEASE_STORE_FILE=${{ runner.temp }}/upload.keystore \
            -PRELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} \
            -PRELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }} \
            -PRELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}

      - name: Save Gradle cache
        if: "!cancelled() && steps.gradle-cache.outputs.cache-hit != 'true'"
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      # ── 12. Upload workflow artifact (AAB only) ──────────────────────────
      - name: Find built AAB
        id: artifacts
        run: |
          AAB=$(find app/build/outputs/bundle/playstoreRelease -name '*.aab' | head -1)
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: guitarrackcraft-${{ inputs.version_name }}-aab
          path: ${{ steps.artifacts.outputs.aab }}


      # ── 14. Verify AAB signature ─────────────────────────────────────────
      - name: Verify AAB is signed
        if: inputs.upload_to_play_store
        run: |
          AAB="${{ steps.artifacts.outputs.aab }}"
          echo "Checking JAR signature on $AAB"
          jarsigner -verify -verbose -certs "$AAB" | head -20
          jarsigner -verify "$AAB"
          echo "AAB signature verified OK"

      # ── 15. Play Store upload ────────────────────────────────────────────
      - name: Upload to Play Store
        if: inputs.upload_to_play_store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_KEY }}
          packageName: com.varcain.guitarrackcraft
          releaseFiles: ${{ steps.artifacts.outputs.aab }}
          track: internal
          status: draft

      # ── 16. Cleanup ──────────────────────────────────────────────────────
      - name: Remove upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"
