# CI — fast X11 unit tests + the full VST-edition build. The heavy parts - the
# VST components (llvm-mingw, wine, FEX, DXVK, Mesa, Turnip, ...) and the
# native prebuild - build as cache-keyed jobs in components.yml (cold ~4-5h,
# all hits ~a minute); `build-vst` then packages them into the `full` flavor
# debug APK (HAS_VST_HOST=true). Runs on push to main, PRs, and manual dispatch.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  test-x11:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libxcb1-dev
      - name: Build and run X11 unit tests
        run: |
          mkdir -p build/tests && cd build/tests
          cmake ../../tests -DCMAKE_BUILD_TYPE=Debug
          make -j$(nproc)
          ctest --output-on-failure

  components:
    uses: ./.github/workflows/components.yml

  # Packages what the component jobs built: packs the VST host stack, stages
  # the native libraries and builds the full debug APK. Compiles only the
  # Gradle modules' C++.
  build-vst:
    needs: components
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6  # v2.0.0
        with: { android: false, preinstalled-runtimes: false, dotnet: true, haskell: true, large-packages: true, docker-images: true, swap-storage: true }
      - uses: actions/checkout@v4

      # patch for apply-patches.sh; patchelf and readelf (binutils) for the pack.
      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends patch patchelf binutils python3

      # The Gradle C++ builds compile oboe, the one submodule this job needs;
      # it gets its 3rd_party/patches as build.sh would apply them.
      - name: Check out and patch oboe
        run: |
          git submodule update --init --depth 1 3rd_party/oboe
          for p in 3rd_party/patches/oboe/*.patch; do
            scripts/apply-patches.sh "$p" 3rd_party/oboe
          done

      - name: Android toolchain
        uses: ./.github/actions/setup-android

      - name: Restore VST components
        uses: ./.github/actions/vst-components
        with: { keys: "${{ toJSON(needs.components.outputs) }}" }

      - name: Restore the native build
        uses: ./.github/actions/native-cache
        with: { mode: restore, fail-on-cache-miss: true }

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # pack-wine-fex.py -> vsthost_lib/src/main/{jniLibs,assets}
      - name: Pack the VST host stack
        env:
          ANDROID_NDK: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VSTHOST }}
        run: cd vsthost_lib && bash scripts/build-all.sh pack

      - name: Stage the native libraries
        run: ./build.sh stage

      - name: Build full debug APK
        run: ./gradlew assembleFullDebug

      # Fails on Windows PE files packaged under lib/ as .so - what antivirus
      # engines flagged in the full APK.
      - name: Audit the APK's Windows binaries
        run: python3 tools/vt_check.py audit app/build/outputs/apk/full/debug/app-full-debug.apk

      - name: Upload full debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gxrc-full-vst-${{ github.sha }}
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 90
          # The APK is already a compressed zip, so re-deflating it in the artifact
          # wrapper just costs upload time for ~no size gain. Store, don't compress.
          # (GitHub always wraps artifacts in a zip — there is no raw-file upload.)
          compression-level: 0
