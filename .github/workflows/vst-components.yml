# The cache-keyed VST component builds, shared by ci.yml and build-deploy.yml
# (workflow_call). `keys` computes one cache key per component; each component
# job restores its output from that key, or builds and caches it (cold ~4-5h
# in total, cache hit ~minutes). The callers restore the outputs by the keys
# this workflow returns.

name: VST components

on:
  workflow_call:
    outputs:
      llvm:
        value: ${{ jobs.keys.outputs.llvm }}
      llvm_android:
        value: ${{ jobs.keys.outputs.llvm_android }}
      x11:
        value: ${{ jobs.keys.outputs.x11 }}
      winedeps:
        value: ${{ jobs.keys.outputs.winedeps }}
      wine:
        value: ${{ jobs.keys.outputs.wine }}
      fex:
        value: ${{ jobs.keys.outputs.fex }}
      dxvk:
        value: ${{ jobs.keys.outputs.dxvk }}
      mesa:
        value: ${{ jobs.keys.outputs.mesa }}
      turnip:
        value: ${{ jobs.keys.outputs.turnip }}
      adrenotools:
        value: ${{ jobs.keys.outputs.adrenotools }}
      hosts:
        value: ${{ jobs.keys.outputs.hosts }}

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  COMMON_APT: >-
    build-essential autoconf automake libtool bison flex gettext gperf
    pkg-config cmake ninja-build meson patchelf patch python3 python3-pip
    python3-mako git xz-utils ca-certificates curl
  X11_APT: >-
    libx11-dev libxext-dev libxrender-dev libxrandr-dev libxi-dev
    libxfixes-dev libxcursor-dev libxxf86vm-dev libfreetype-dev
    fonts-liberation fonts-dejavu
  NATIVE_APT: >-
    gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 g++-mingw-w64-x86-64
    ocaml ocamlbuild ocaml-findlib libnum-ocaml-dev faust libboost-dev ccache

jobs:
  keys:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      llvm: ${{ steps.k.outputs.llvm }}
      llvm_android: ${{ steps.k.outputs.llvm_android }}
      x11: ${{ steps.k.outputs.x11 }}
      winedeps: ${{ steps.k.outputs.winedeps }}
      wine: ${{ steps.k.outputs.wine }}
      fex: ${{ steps.k.outputs.fex }}
      dxvk: ${{ steps.k.outputs.dxvk }}
      mesa: ${{ steps.k.outputs.mesa }}
      turnip: ${{ steps.k.outputs.turnip }}
      adrenotools: ${{ steps.k.outputs.adrenotools }}
      hosts: ${{ steps.k.outputs.hosts }}
      ndk_vst: ${{ steps.k.outputs.ndk_vst }}
      ndk_native: ${{ steps.k.outputs.ndk_native }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute the cache keys (scripts/ci/cache-keys.sh)
        id: k
        run: scripts/ci/cache-keys.sh >> "$GITHUB_OUTPUT"

  # Each component job first looks its cache entry up without downloading it
  # (lookup-only): on a hit the job is done - the consumers restore the entry
  # themselves. On a miss it builds, then saves (only if the build succeeded).

  llvm:
    needs: keys
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Look up the llvm-mingw install
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: vsthost_lib/external/llvm-mingw/install
          key: ${{ needs.keys.outputs.llvm }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
      - name: Free disk space
        if: steps.cache.outputs.cache-hit != 'true'
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6  # v2.0.0
        with: { android: true, preinstalled-runtimes: false, dotnet: true, haskell: true, large-packages: true, docker-images: true, swap-storage: true }
      - name: Build llvm-mingw
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends $COMMON_APT
          git submodule update --init \
            vsthost_lib/external/llvm-mingw \
            vsthost_lib/external/wine-upstream \
            vsthost_lib/external/fex-upstream
          cd vsthost_lib && bash scripts/build-all.sh llvm
      - name: Save the llvm-mingw install
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vsthost_lib/external/llvm-mingw/install
          key: ${{ needs.keys.outputs.llvm }}

  llvm-android:
    needs: keys
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NDK_VSTHOST: ${{ needs.keys.outputs.ndk_vst }}
    steps:
      - name: Look up the android LLVM install
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: vsthost_lib/external/llvm-android/install-android-arm64
          key: ${{ needs.keys.outputs.llvm_android }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
      - name: Free disk space
        if: steps.cache.outputs.cache-hit != 'true'
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6  # v2.0.0
        with: { android: false, preinstalled-runtimes: false, dotnet: true, haskell: true, large-packages: true, docker-images: true, swap-storage: true }
      - name: System deps + host LLVM 18 + NDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends $COMMON_APT llvm-18
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VSTHOST}"
      - name: Fetch + cross-build LLVM 18.1.3
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VSTHOST }}
        run: |
          export HOST_LLVM_TBLGEN="$(command -v llvm-tblgen-18 || echo /usr/lib/llvm-18/bin/llvm-tblgen)"
          cd vsthost_lib
          bash scripts/fetch-llvm-source.sh
          bash scripts/build-llvm-android.sh
      - name: Save the android LLVM install
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vsthost_lib/external/llvm-android/install-android-arm64
          key: ${{ needs.keys.outputs.llvm_android }}

  x11:
    needs: keys
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_NATIVE: ${{ needs.keys.outputs.ndk_native }}
    steps:
      - name: Look up the X11 sysroot
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: build/x11_ui
          key: ${{ needs.keys.outputs.x11 }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
      - name: System deps + NDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends $COMMON_APT $X11_APT $NATIVE_APT
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_NATIVE}"
      - name: Init X11 submodules
        if: steps.cache.outputs.cache-hit != 'true'
        run: git submodule update --init --recursive 3rd_party/x11
      - name: Build X11 sysroot
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_NATIVE }}
        run: cd vsthost_lib && bash scripts/build-all.sh x11
      - name: Save the X11 sysroot
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/x11_ui
          key: ${{ needs.keys.outputs.x11 }}

  wine:
    needs: [keys, llvm, x11]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      NDK_VSTHOST: ${{ needs.keys.outputs.ndk_vst }}
    steps:
      - name: Look up winedeps
        id: winedeps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            vsthost_lib/toolchain/x11-libs
            vsthost_lib/toolchain/x11-headers
            vsthost_lib/toolchain/wine-fonts
            vsthost_lib/toolchain/android-libs
            vsthost_lib/toolchain/gnutls-android-arm64
          key: ${{ needs.keys.outputs.winedeps }}
          lookup-only: true
      - name: Look up the wine output tar
        id: wine-cache
        uses: actions/cache/restore@v4
        with:
          path: vsthost_lib/wine-android-out.tar
          key: ${{ needs.keys.outputs.wine }}
          lookup-only: true
      - if: steps.winedeps-cache.outputs.cache-hit != 'true' || steps.wine-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
      - name: Free disk space
        if: steps.winedeps-cache.outputs.cache-hit != 'true' || steps.wine-cache.outputs.cache-hit != 'true'
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6  # v2.0.0
        with: { android: false, preinstalled-runtimes: false, dotnet: true, haskell: true, large-packages: true, docker-images: true, swap-storage: true }
      - name: System deps + NDK
        if: steps.winedeps-cache.outputs.cache-hit != 'true' || steps.wine-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends $COMMON_APT $X11_APT
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VSTHOST}"
      # wine builds against winedeps: restore them when cached, else build them.
      - name: Restore winedeps
        if: steps.winedeps-cache.outputs.cache-hit == 'true' && steps.wine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            vsthost_lib/toolchain/x11-libs
            vsthost_lib/toolchain/x11-headers
            vsthost_lib/toolchain/wine-fonts
            vsthost_lib/toolchain/android-libs
            vsthost_lib/toolchain/gnutls-android-arm64
          key: ${{ needs.keys.outputs.winedeps }}
          fail-on-cache-miss: true
      - name: Build winedeps
        if: steps.winedeps-cache.outputs.cache-hit != 'true'
        run: cd vsthost_lib && bash scripts/build-all.sh winedeps
      - name: Save winedeps
        if: steps.winedeps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            vsthost_lib/toolchain/x11-libs
            vsthost_lib/toolchain/x11-headers
            vsthost_lib/toolchain/wine-fonts
            vsthost_lib/toolchain/android-libs
            vsthost_lib/toolchain/gnutls-android-arm64
          key: ${{ needs.keys.outputs.winedeps }}
      - name: Restore llvm-mingw
        if: steps.wine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: vsthost_lib/external/llvm-mingw/install
          key: ${{ needs.keys.outputs.llvm }}
          fail-on-cache-miss: true
      - name: Restore X11 sysroot
        if: steps.wine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: build/x11_ui
          key: ${{ needs.keys.outputs.x11 }}
          fail-on-cache-miss: true
      - name: Build wine + stage lean output tar
        if: steps.wine-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VSTHOST }}
        run: |
          git submodule update --init vsthost_lib/external/wine-upstream
          cd vsthost_lib
          bash scripts/build-all.sh wine
          tar --exclude='*.o' --exclude='*.a' --exclude='*.cross.o' \
              -cf wine-android-out.tar -C external/wine-upstream build-android-arm64
      - name: Save the wine output tar
        if: steps.wine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vsthost_lib/wine-android-out.tar
          key: ${{ needs.keys.outputs.wine }}

  fex:
    needs: [keys, llvm]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Look up FEX Bin
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            vsthost_lib/external/fex-upstream/build-arm64ec/Bin
            vsthost_lib/external/fex-upstream/build-wow64/Bin
          key: ${{ needs.keys.outputs.fex }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
      - name: Free disk space
        if: steps.cache.outputs.cache-hit != 'true'
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6  # v2.0.0
        with: { android: true, preinstalled-runtimes: false, dotnet: true, haskell: true, large-packages: true, docker-images: true, swap-storage: true }
      - name: Restore llvm-mingw
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: vsthost_lib/external/llvm-mingw/install
          key: ${{ needs.keys.outputs.llvm }}
          fail-on-cache-miss: true
      - name: Build FEX
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends $COMMON_APT
          git submodule update --init --recursive vsthost_lib/external/fex-upstream
          cd vsthost_lib && bash scripts/build-all.sh fex
      - name: Save FEX Bin
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            vsthost_lib/external/fex-upstream/build-arm64ec/Bin
            vsthost_lib/external/fex-upstream/build-wow64/Bin
          key: ${{ needs.keys.outputs.fex }}

  dxvk:
    needs: [keys, llvm]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Look up the DXVK assets
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: vsthost_lib/src/main/assets/dxvk
          key: ${{ needs.keys.outputs.dxvk }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
      - name: Free disk space
        if: steps.cache.outputs.cache-hit != 'true'
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6  # v2.0.0
        with: { android: true, preinstalled-runtimes: false, dotnet: true, haskell: true, large-packages: true, docker-images: true, swap-storage: true }
      - name: Restore llvm-mingw
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: vsthost_lib/external/llvm-mingw/install
          key: ${{ needs.keys.outputs.llvm }}
          fail-on-cache-miss: true
      - name: Build DXVK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends $COMMON_APT
          git submodule update --init --recursive \
            vsthost_lib/external/dxvk vsthost_lib/external/Vulkan-Headers \
            vsthost_lib/external/glslang
          cd vsthost_lib && bash scripts/build-all.sh dxvk
      - name: Save the DXVK assets
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vsthost_lib/src/main/assets/dxvk
          key: ${{ needs.keys.outputs.dxvk }}

  mesa:
    needs: keys
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NDK_VSTHOST: ${{ needs.keys.outputs.ndk_vst }}
    steps:
      - name: Look up the Mesa-Zink asset
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: vsthost_lib/src/main/assets/mesa-zink-libs.tar.gz
          key: ${{ needs.keys.outputs.mesa }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
      - name: Free disk space
        if: steps.cache.outputs.cache-hit != 'true'
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6  # v2.0.0
        with: { android: false, preinstalled-runtimes: false, dotnet: true, haskell: true, large-packages: true, docker-images: true, swap-storage: true }
      - name: Build Mesa-Zink
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VSTHOST }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends $COMMON_APT
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VSTHOST}"
          git submodule update --init 3rd_party/mesa
          cd vsthost_lib && bash scripts/build-all.sh mesa
      - name: Save the Mesa-Zink asset
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vsthost_lib/src/main/assets/mesa-zink-libs.tar.gz
          key: ${{ needs.keys.outputs.mesa }}

  turnip:
    needs: [keys, llvm-android]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NDK_VSTHOST: ${{ needs.keys.outputs.ndk_vst }}
    steps:
      - name: Look up the Turnip asset
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: vsthost_lib/src/main/assets/turnip-libs.tar.gz
          key: ${{ needs.keys.outputs.turnip }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
      - name: Free disk space
        if: steps.cache.outputs.cache-hit != 'true'
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6  # v2.0.0
        with: { android: false, preinstalled-runtimes: false, dotnet: true, haskell: true, large-packages: true, docker-images: true, swap-storage: true }
      # lavapipe, the software-Vulkan fallback, links it.
      - name: Restore android LLVM install
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: vsthost_lib/external/llvm-android/install-android-arm64
          key: ${{ needs.keys.outputs.llvm_android }}
          fail-on-cache-miss: true
      - name: Build Turnip, the Vulkan loader and lavapipe
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VSTHOST }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends $COMMON_APT python3-venv
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VSTHOST}"
          # lavapipe links LLVM 18 through meson's cmake method, which needs
          # meson >= 1.4 (apt has 1.3.2); build-lavapipe-android.sh uses the
          # meson in this venv.
          python3 -m venv vsthost_lib/.cache/meson-venv
          vsthost_lib/.cache/meson-venv/bin/pip install --quiet 'meson==1.7.2'
          git submodule update --init 3rd_party/mesa \
            vsthost_lib/external/Vulkan-Loader vsthost_lib/external/Vulkan-Headers
          cd vsthost_lib && bash scripts/build-all.sh turnip
      - name: Save the Turnip asset
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vsthost_lib/src/main/assets/turnip-libs.tar.gz
          key: ${{ needs.keys.outputs.turnip }}

  adrenotools:
    needs: keys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NDK_VSTHOST: ${{ needs.keys.outputs.ndk_vst }}
    steps:
      - name: Look up the adrenotools libs
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: vsthost_lib/toolchain/adrenotools-libs
          key: ${{ needs.keys.outputs.adrenotools }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
      - name: Build libadrenotools
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VSTHOST }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends $COMMON_APT
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VSTHOST}"
          git submodule update --init --recursive vsthost_lib/external/libadrenotools
          cd vsthost_lib && bash scripts/build-all.sh adrenotools
      - name: Save the adrenotools libs
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vsthost_lib/toolchain/adrenotools-libs
          key: ${{ needs.keys.outputs.adrenotools }}

  hosts:
    needs: keys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Look up the host executables
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            vsthost_lib/src/main/assets/vst_host.exe
            vsthost_lib/src/main/assets/vst_host_x86.exe
            vsthost_lib/src/main/assets/vst3_host.exe
            vsthost_lib/src/main/assets/uihost_stub_x64.dll
            vsthost_lib/src/main/assets/uihost_stub_x86.dll
          key: ${{ needs.keys.outputs.hosts }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
      - name: Build vst_host, vst3_host and the uihost stubs
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 g++-mingw-w64-x86-64
          git submodule update --init --recursive vsthost_lib/external/vst3sdk
          cd vsthost_lib && bash scripts/build-all.sh hosts
          # build-all.sh skips vst3_host.exe when the SDK is missing; the pack needs it.
          test -f src/main/assets/vst3_host.exe
      - name: Save the host executables
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
