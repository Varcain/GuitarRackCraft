# Restores the VST host component outputs that the vst-components workflow
# built and cached (read-only; a miss fails the job - it means that
# workflow didn't populate the cache), and unpacks wine's build tree.
#
#   - uses: ./.github/actions/vst-components
#     with: { keys: "${{ toJSON(needs.components.outputs) }}" }

name: VST components
description: Restore the VST host components the vst-components workflow cached

inputs:
  keys:
    description: the vst-components workflow's outputs (its cache keys), as JSON
    required: true

runs:
  using: composite
  steps:
    - name: Restore winedeps
      uses: actions/cache/restore@v4
      with:
        path: |
          vsthost_lib/toolchain/x11-libs
          vsthost_lib/toolchain/x11-headers
          vsthost_lib/toolchain/wine-fonts
          vsthost_lib/toolchain/android-libs
          vsthost_lib/toolchain/gnutls-android-arm64
        key: ${{ fromJSON(inputs.keys).winedeps }}
        fail-on-cache-miss: true

    - name: Restore wine output tar
      uses: actions/cache/restore@v4
      with:
        path: vsthost_lib/wine-android-out.tar
        key: ${{ fromJSON(inputs.keys).wine }}
        fail-on-cache-miss: true

    - name: Restore FEX Bin
      uses: actions/cache/restore@v4
      with:
        path: |
          vsthost_lib/external/fex-upstream/build-arm64ec/Bin
          vsthost_lib/external/fex-upstream/build-wow64/Bin
        key: ${{ fromJSON(inputs.keys).fex }}
        fail-on-cache-miss: true

    - name: Restore DXVK assets
      uses: actions/cache/restore@v4
      with:
        path: vsthost_lib/src/main/assets/dxvk
        key: ${{ fromJSON(inputs.keys).dxvk }}
        fail-on-cache-miss: true

    - name: Restore Mesa-Zink asset
      uses: actions/cache/restore@v4
      with:
        path: vsthost_lib/src/main/assets/mesa-zink-libs.tar.gz
        key: ${{ fromJSON(inputs.keys).mesa }}
        fail-on-cache-miss: true

    # build.sh reuses the x11 job's X11 sysroot instead of rebuilding it.
    - name: Restore X11 sysroot
      uses: actions/cache/restore@v4
      with:
        path: build/x11_ui
        key: ${{ fromJSON(inputs.keys).x11 }}
        fail-on-cache-miss: true

    # pack-wine-fex.py's wine prune check reads PE imports with this
    # toolchain's llvm-readobj (needs LLVM >= 19 for the ARM64X EC view).
    - name: Restore llvm-mingw install
      uses: actions/cache/restore@v4
      with:
        path: vsthost_lib/external/llvm-mingw/install
        key: ${{ fromJSON(inputs.keys).llvm }}
        fail-on-cache-miss: true

    - name: Restore the Turnip asset
      uses: actions/cache/restore@v4
      with:
        path: vsthost_lib/src/main/assets/turnip-libs.tar.gz
        key: ${{ fromJSON(inputs.keys).turnip }}
        fail-on-cache-miss: true

    - name: Restore the adrenotools libs
      uses: actions/cache/restore@v4
      with:
        path: vsthost_lib/toolchain/adrenotools-libs
        key: ${{ fromJSON(inputs.keys).adrenotools }}
        fail-on-cache-miss: true

    - name: Restore the host executables
      uses: actions/cache/restore@v4
      with:
        path: |
          vsthost_lib/src/main/assets/vst_host.exe
          vsthost_lib/src/main/assets/vst_host_x86.exe
          vsthost_lib/src/main/assets/vst3_host.exe
          vsthost_lib/src/main/assets/uihost_stub_x64.dll
          vsthost_lib/src/main/assets/uihost_stub_x86.dll
        key: ${{ fromJSON(inputs.keys).hosts }}
        fail-on-cache-miss: true

    - name: Unpack wine output into its build dir
      shell: bash
      run: |
        tar -xf vsthost_lib/wine-android-out.tar -C vsthost_lib/external/wine-upstream
        test -x vsthost_lib/external/wine-upstream/build-android-arm64/loader/wine
