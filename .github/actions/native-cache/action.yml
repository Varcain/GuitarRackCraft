# The native prebuild's outputs (build.sh), under the exact key
# `scripts/ci/cache-keys.sh native`. Restore and save use the same path list
# (actions/cache folds the paths into the cache version, so a restore with
# other paths never finds the entry).
#
# Exact key only, on purpose: a prefix restore brings back a stale autotools
# build tree (e.g. build/x11_ui/libX11 configured with other CONFIGURE_ARGS)
# that then fails to reconfigure in place. A miss means a clean build; ccache
# keeps it fast.
#
# Cached: all of build/ except the root Gradle project's build/gradle, the
# assets the native build writes into app/src/main/assets, and the app's LV2
# prefix (app/src/main/cpp/libs). The staged libraries (jniLibs, the full
# overlay, the asset packs) aren't: build.sh re-stages them from
# build/prebuild/stage, also on an exact hit (NATIVE_CACHE_EXACT).
#
#   - id: native-cache
#     uses: ./.github/actions/native-cache
#     with: { mode: restore }
#   ... BUILD_VST=0 NATIVE_CACHE_EXACT=${{ steps.native-cache.outputs.cache-hit }} ./build.sh ...
#   - if: steps.native-cache.outputs.cache-hit != 'true'
#     uses: ./.github/actions/native-cache
#     with: { mode: save, key: "${{ steps.native-cache.outputs.key }}" }

name: Native build cache
description: Restore or save the native prebuild's outputs under the exact native cache key

inputs:
  mode:
    description: restore or save
    required: true
  key:
    description: the key to save under (the restore step's `key` output)
    required: false

outputs:
  key:
    description: the native cache key (restore)
    value: ${{ steps.key.outputs.native }}
  cache-hit:
    description: "'true' on an exact hit (restore)"
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - id: paths
      shell: bash
      run: |
        {
          echo 'paths<<EOF'
          echo 'build/'
          echo '!build/gradle'
          echo 'app/src/main/assets'
          echo 'app/src/main/cpp/libs'
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

    - id: key
      if: inputs.mode == 'restore'
      shell: bash
      run: scripts/ci/cache-keys.sh native >> "$GITHUB_OUTPUT"

    - id: restore
      if: inputs.mode == 'restore'
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.paths.outputs.paths }}
        key: ${{ steps.key.outputs.native }}

    # app/src/main/assets also holds tracked files (modgui_runtime.js, plugin
    # screenshots and modgui overrides) that the key doesn't cover. The build
    # never changes them, so this commit's versions go back over the cached
    # copies.
    - if: inputs.mode == 'restore' && steps.restore.outputs.cache-hit == 'true'
      shell: bash
      run: git checkout -- app/src/main/assets

    - if: inputs.mode == 'save'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.paths.outputs.paths }}
        key: ${{ inputs.key }}
