# wine-prune.conf — which wine PE files scripts/pack-wine-fex.py leaves OUT
# of the APK.
#
# Why: the full APK shipped every wine builtin (~1.5k Windows DLLs/EXEs, i386
# + ARM64), and those files are what antivirus engines flag — mostly ones VST
# hosting never touches (e.g. dxtrans.dll: 28 VirusTotal engines,
# mfh264enc.dll: 15, regedit.exe: 10). Fewer files = fewer detections, a
# smaller APK and a smaller on-device runtime.
#
# Safety: the packer refuses to pack if a kept module imports, delay-imports
# or export-forwards to a pruned one (checked with llvm-readobj, both ARM64X
# views), or if a pruned file matches [dlls.keep]. `--no-prune` disables all
# of this. A DLL that is only LoadLibrary'd by name can't be caught by that
# check — list those in [dlls.keep].
#
# Syntax: [section] headers; one case-insensitive fnmatch pattern per line,
# matched against the file name in both aarch64-windows/ and i386-windows/;
# '#' starts a comment.

[programs.keep]
# Allowlist: programs only ever run when something launches them explicitly,
# so every *.exe NOT listed here is pruned.
# -- launched by our code
wineboot.exe      # WineHostProcess bootServicesIfNeeded, jni_runtime (wineboot --update)
reg.exe           # WineHostProcess: PROCESSOR_ARCHITECTURE seed
rpcss.exe         # WineHostProcess + seedRpcSsService
msiexec.exe       # jni_runtime nativeStartInstaller (.msi) + msi custom-action server
cmd.exe           # COMSPEC; installers / Electron spawn it
# -- spawned by wine itself
services.exe
winedevice.exe
plugplay.exe
explorer.exe      # virtual desktop + shell execute
svchost.exe
conhost.exe
start.exe
dllhost.exe
regsvr32.exe
rundll32.exe
# -- small CLI tools installer / licence-manager scripts call (wine's
#    versions are tiny, and an MSI custom action that can't find one fails)
sc.exe
net.exe
taskkill.exe
tasklist.exe
where.exe
whoami.exe
hostname.exe
ipconfig.exe
