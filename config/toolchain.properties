# Toolchain versions the build pins. Read by Gradle (app, vsthost_lib), the
# native prebuild (cmake/CMakeLists.txt) and the VST toolchain scripts
# (vsthost_lib/scripts/lib/common.sh). Plain key=value; '#' starts a comment.

# NDK for everything that shares the APK's libc++_shared.so: :app,
# :vsthost_lib and the native prebuild (LV2 plugins, lilv, X11/Mesa).
ndk.version=27.2.12479018

# NDK for the VST toolchain scripts (wine's Android side, freetype/gnutls,
# libdrm/Mesa/turnip, ...). Kept separate until those are rebuilt and
# device-tested on ndk.version.
ndk.version.vst=26.1.10909125
